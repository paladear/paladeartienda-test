# Solo regenera los sitemaps para Google, leyendo los archivos del propio repo.
# Los precios y las fichas los maneja el panel: este workflow NO los toca.
name: Actualizar sitemap de productos

on:
  schedule:
    # Lun-Sáb cada 2hs en horario comercial Argentina (UTC-3)
    # 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00 ART
    - cron: '0 11,13,15,17,19,21,23 * * 1-6'
  workflow_dispatch: # también se puede disparar manualmente desde GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerar el sitemap de productos
        run: node scripts/generate-product-sitemap.mjs

      - name: Commit si hubo cambios
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add sitemap.xml sitemap.txt
          if git diff --staged --quiet; then
            echo "El sitemap ya estaba al día, nada que commitear."
          else
            git commit -m "🗺️ Sitemap de productos actualizado"
            git push
          fi
